<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランダムローディング画面</title>
<style>
  /* --- 1. ローディング画面の基本スタイル（全画面固定） --- */
  #loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #f0f0f0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s ease; /* フェードアウト用 */
  }

  /* 読み込み完了後に非表示にするためのクラス */
  #loading-screen.loaded {
    opacity: 0;
    pointer-events: none;
  }

  /* --- 2. 各パターンのコンテナ（最初はすべて非表示） --- */
  .loader-item {
    display: none;
    font-size: 1.5rem;
    font-weight: bold;
    color: #333;
  }

  /* --- 3. JavaScriptで付与されたクラスに応じて表示を切り替え --- */
  /* 親要素に .pattern-1 がついたら、中の .item-1 を表示 */
  #loading-screen.pattern-1 .item-1 { display: block; }
  #loading-screen.pattern-2 .item-2 { display: block; }
  #loading-screen.pattern-3 .item-3 { display: block; }
  #loading-screen.pattern-4 .item-4 { display: block; }

  /* --- 4. 各パターンのアニメーション装飾（サンプル） --- */
  /* パターン1: 回転 */
  .item-1::after { content: " 🔄"; display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* パターン2: 点滅 */
  .item-2 { animation: blink 1s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.2; } }

  /* パターン3: バウンド */
  .item-3 { animation: bounce 0.5s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }

  /* パターン4: 拡大縮小 */
  .item-4 { animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.5); } }
</style>
</head>
<body>

  <div id="loading-screen">
    <div class="loader-item item-1">パターンA：回転中...</div>
    <div class="loader-item item-2">パターンB：点滅中...</div>
    <div class="loader-item item-3">パターンC：ジャンプ中...</div>
    <div class="loader-item item-4">パターンD：拡大中...</div>
  </div>

  <div style="padding: 20px;">
    <h1>メインコンテンツ</h1>
    <p>ページの読み込みが完了するとローディング画面が消えます。</p>
    <p>リロード（F5）してパターンが変わるか試してください。</p>
  </div>

  <script>
    // --- 1. ランダムなパターンを決定する処理 ---
    // 1〜4の乱数を生成
    const patternNum = Math.floor(Math.random() * 4) + 1;
    
    // ローディング画面の要素を取得
    const loader = document.getElementById('loading-screen');
    
    // 生成した番号のクラス（pattern-1 など）を付与
    loader.classList.add('pattern-' + patternNum);


    // --- 2. 読み込み完了後に画面を消す処理 ---
    window.addEventListener('load', () => {
      // 動作確認用に少し遅延させています（本番では setTimeout は不要です）
      setTimeout(() => {
        loader.classList.add('loaded');
        
        // アニメーション終了後にDOMから完全に削除したい場合（任意）
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500); // CSSのtransition時間と同じにする
      }, 1000); // 1秒間ローディングを見せる
    });
  </script>

</body>
</html>
